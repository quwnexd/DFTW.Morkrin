<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стена Ворона — Dark Fantasy Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">

  <!-- Игровой канвас -->
  <canvas id="gameCanvas" width="480" height="720"></canvas>

  <!-- HUD (виден только во время игры) -->
  <div id="hud" class="hidden">
    <div class="hud-item">🏰 <span id="hp-value">100</span></div>
    <div class="hud-item">⭐ <span id="score-value">0</span></div>
    <div class="hud-item">🌊 <span id="wave-value">1</span></div>
    <button id="pause-btn" class="icon-btn">II</button>
  </div>

  <!-- Главное меню -->
  <div id="menu-screen" class="overlay-screen">
    <div class="gothic-frame">
      <h1 class="game-title">СТЕНА<br>ВОРОНА</h1>
      <p class="subtitle">dark fantasy tower defense</p>
      <button id="play-btn" class="stone-btn">Играть</button>
      <button id="settings-btn" class="stone-btn">Настройки</button>
      <button id="about-btn" class="stone-btn">Об игре</button>
    </div>
  </div>

  <!-- Экран паузы -->
  <div id="pause-screen" class="overlay-screen hidden">
    <div class="gothic-frame">
      <div class="crossed-arrows">✕</div>
      <h1 class="game-title small">ПАУЗА</h1>
      <button id="resume-btn" class="stone-btn">Продолжить</button>
      <button id="restart-btn" class="stone-btn">Начать заново</button>
      <button id="menu-btn" class="stone-btn">В главное меню</button>
    </div>
  </div>

  <!-- Экран настроек -->
  <div id="settings-screen" class="overlay-screen hidden">
    <div class="gothic-frame">
      <h1 class="game-title small">НАСТРОЙКИ</h1>
      <label class="setting-row">
        <span>Звук</span>
        <input type="checkbox" id="sound-toggle" checked>
      </label>
      <button id="settings-back-btn" class="stone-btn">Назад</button>
    </div>
  </div>

  <!-- Экран "Об игре" -->
  <div id="about-screen" class="overlay-screen hidden">
    <div class="gothic-frame">
      <h1 class="game-title small">ОБ ИГРЕ</h1>
      <p class="about-text">
        Орки штурмуют стену замка. Стреляйте по ним, отбивайте волну за волной
        и не дайте стене пасть. Кликните по врагу, чтобы выстрелить.
      </p>
      <button id="about-back-btn" class="stone-btn">Назад</button>
    </div>
  </div>

  <!-- Экран поражения -->
  <div id="gameover-screen" class="overlay-screen hidden">
    <div class="gothic-frame">
      <h1 class="game-title small red-glow">СТЕНА ПАЛА</h1>
      <p class="about-text">Волна: <span id="final-wave">1</span> · Счёт: <span id="final-score">0</span></p>
      <button id="retry-btn" class="stone-btn">Начать заново</button>
      <button id="gameover-menu-btn" class="stone-btn">В главное меню</button>
    </div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
